name: Build & Release

on:
  # 推送 vX.Y.Z 标签时自动构建并发布 Release
  push:
    tags:
      - "v*"
  # 也支持手动触发（用当前 versionName 作为版本号）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Extract version name
        id: ver
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/CheckInApp-v${{ steps.ver.outputs.version }}.apk"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: CheckInApp v${{ steps.ver.outputs.version }}
          files: app/build/outputs/apk/debug/CheckInApp-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
